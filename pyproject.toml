[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shivalipi"
version = "0.1.3"
description = "Fast vision engine and linguistic mapper deciphering historical Modi Lipi documents into Devanagari Marathi."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "Rohit Manikrao Patil" }
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "datasets",
    "accelerate",
    "evaluate",
]

[project.urls]
"Homepage" = "https://www.rohitmanikraopatil.com"